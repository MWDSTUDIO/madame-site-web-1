<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weddings — Madame Wedding Design | Luxury Weddings in France, Italy &amp; Europe</title>
  <meta name="description" content="A curated selection of celebrations planned and produced by Madame Wedding Design — Castiglion del Bosco in Tuscany, Paris, a château in Burgundy, and beyond.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='Georgia'>M</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body class="page">

  <header class="nav nav--page">
    <a class="nav__logo" href="/">Madame Wedding Design</a>
    <nav class="nav__links" aria-label="Main navigation">
      <a href="/maison/">The Maison</a>
      <a href="/weddings/" aria-current="page">Weddings</a>
      <a href="/services/">Services</a>
      <a href="/journal/">The Journal</a>
      <a class="nav__inquire" href="/inquire/">Inquire</a>
    </nav>
  </header>

  <main>
    <div class="page-hero reveal">
      <p class="page-hero__eyebrow">Weddings</p>
      <h1 class="page-hero__title">A curated selection<br>of celebrations.</h1>
    </div>

    <section style="padding: 0 clamp(1.5rem, 6vw, 5rem) clamp(4rem, 9vh, 7rem)">
      <div class="weddings__grid" id="weddingsGrid"><!-- rendered from /data/weddings.json --></div>
    </section>

    <section class="cta-band">
      <p>Yours could be next.</p>
      <a class="inquire__cta" href="/inquire/">Inquire</a>
    </section>
  </main>

  <footer class="footer">
    <p>Madame Wedding Design — Wedding Planning &amp; Production · Paris</p>
    <p><a href="mailto:hello@madamewedding.design">hello@madamewedding.design</a></p>
  </footer>

  <script src="/assets/js/page.js"></script>
  <script>
    fetch('/data/weddings.json').then(function (r) { return r.json(); }).then(function (data) {
      var grid = document.getElementById('weddingsGrid');
      var tints = ['ph--a', 'ph--b', 'ph--c'];
      data.weddings.forEach(function (w, i) {
        var cover = (w.portfolio.photos && w.portfolio.photos[0]) || null;
        var a = document.createElement('a');
        a.className = 'wedding-card';
        a.href = '/weddings/' + w.slug + '/';
        a.innerHTML =
          (cover
            ? '<img class="wedding-card__img" src="' + cover.src + '" alt="' + cover.alt + '" loading="lazy" style="width:100%;aspect-ratio:4/5;object-fit:cover">'
            : '<div class="wedding-card__img ' + tints[i % 3] + '" role="img" aria-label="' + w.displayTitle + ' — ' + w.destination + '"></div>') +
          '<p class="wedding-card__caption">' + w.displayTitle + ' — <span>' + w.destination.split(',').pop().trim() + '</span></p>' +
          '<p class="wedding-card__origin">' + w.coupleOrigin + '</p>';
        grid.appendChild(a);
      });
    });
  </script>
</body>
</html>
